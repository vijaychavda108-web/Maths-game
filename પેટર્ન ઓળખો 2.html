<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પેટર્ન આગળ વધારો</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta+Vaani:wght@400;700&display=swap');

        body {
            font-family: 'Mukta Vaani', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
            user-select: none;
        }

        .game-container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            margin: auto;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            border: 6px solid #4caf50;
        }

        h1 {
            color: #d84315;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 1px 1px #ffe0b2;
        }

        .instruction {
            color: #37474f;
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .instruction small {
            color: #78909c;
            font-size: 14px;
        }

        .pattern-area {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            background: #fff9c4;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #fbc02d;
            min-height: 80px;
        }

        .pattern-item {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pattern-item svg, .option svg, .drop-zone svg {
            width: 100%;
            height: 100%;
            pointer-events: none; /* Helps with drag and drop */
        }

        .drop-zone {
            width: 60px;
            height: 60px;
            border: 3px dashed #1976d2;
            border-radius: 10px;
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .drop-zone.highlight {
            background-color: #bbdefb;
            border-color: #1565c0;
            transform: scale(1.05);
        }

        .options-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option {
            width: 65px;
            height: 65px;
            background-color: #f5f5f5;
            border: 3px solid #9e9e9e;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
            padding: 5px;
            box-sizing: border-box;
        }

        .option:hover {
            border-color: #2196f3;
        }

        .option:active {
            transform: scale(0.9);
        }

        .option.selected {
            background-color: #e1f5fe;
            border-color: #0288d1;
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(2, 136, 209, 0.3);
        }

        .feedback {
            font-size: 26px;
            font-weight: bold;
            height: 40px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .correct { color: #388e3c; }
        .wrong { color: #d32f2f; }

        .score-board {
            font-size: 22px;
            color: #4527a0;
            font-weight: bold;
            margin-top: 15px;
            background: #ede7f6;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
        }

        .footer {
            margin-top: 25px;
            font-size: 16px;
            color: #263238;
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
            line-height: 1.6;
            border-left: 5px solid #ff9800;
        }

        button.restart-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
            transition: background 0.3s;
        }

        button.restart-btn:hover { background-color: #43a047; }

        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            .pattern-item, .drop-zone { width: 45px; height: 45px; }
            .option { width: 55px; height: 55px; }
            .instruction { font-size: 15px; }
            .game-container { padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>પેટર્ન આગળ વધારો</h1>
        <div class="instruction">
            નીચેની પેટર્ન સમજો અને સાચો જવાબ ખેંચીને (Drag) ખાલી જગ્યામાં મૂકો.<br>
            <small>(મોબાઈલમાં: પહેલા નીચેના વિકલ્પ પર ટચ કરો, પછી ખાલી જગ્યા પર ટચ કરો)</small>
        </div>

        <div id="game-board">
            <div class="pattern-area" id="pattern-container">
                </div>

            <div class="options-area" id="options-container">
                </div>

            <div class="feedback" id="feedback-msg"></div>
            <div class="score-board" id="score-display">સ્કોર: 0</div>
        </div>

        <div id="end-screen" style="display: none;">
            <h2 class="correct" style="font-size: 32px;">અભિનંદન! રમત પૂરી થઈ.</h2>
            <div class="score-board" id="final-score" style="font-size: 26px;"></div><br>
            <button class="restart-btn" id="restart-btn" onclick="startGame()">ફરીથી રમો</button>
        </div>
    </div>

    <div class="footer">
        <strong>Created by:</strong> વિજયકુમાર ચાવડા<br>
        <strong>શાળા :</strong> દાદાના મુવાડા પ્રા શાળા
    </div>

    <script>
        // SVG Data based exactly on your uploaded image patterns
        const svgs = {
            // Row 6 (Shapes)
            diamond: '<svg viewBox="0 0 100 100"><polygon points="50,15 85,50 50,85 15,50" fill="none" stroke="#1565c0" stroke-width="4"/></svg>',
            star: '<svg viewBox="0 0 100 100"><path d="M50,15 L60,40 L85,40 L65,55 L75,80 L50,65 L25,80 L35,55 L15,40 L40,40 Z" fill="none" stroke="#1565c0" stroke-width="3"/></svg>',
            heart: '<svg viewBox="0 0 100 100"><path d="M50,85 L25,60 C10,45 20,15 35,15 C45,15 50,25 50,25 C50,25 55,15 65,15 C80,15 90,45 75,60 Z" fill="none" stroke="#1565c0" stroke-width="3"/></svg>',
            flower: '<svg viewBox="0 0 100 100"><circle cx="50" cy="35" r="12" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="65" cy="50" r="12" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="50" cy="65" r="12" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="35" cy="50" r="12" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="50" cy="50" r="8" fill="none" stroke="#1565c0" stroke-width="3"/></svg>',
            
            // Row 8 (Symbols)
            circle: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#1565c0" stroke-width="4"/></svg>',
            plus: '<svg viewBox="0 0 100 100"><path d="M40,20 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z" fill="none" stroke="#1565c0" stroke-width="4" stroke-linejoin="round"/></svg>',
            vshape: '<svg viewBox="0 0 100 100"><path d="M25,25 L50,75 L75,25" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            arch: '<svg viewBox="0 0 100 100"><path d="M25,75 A25,25 0 0,1 75,75" fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/></svg>',
            
            // Row 5 (Chevrons/Arrows)
            chev_up: '<svg viewBox="0 0 100 100"><path d="M20,65 L50,25 L80,65" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round"/></svg>',
            chev_right: '<svg viewBox="0 0 100 100"><path d="M35,20 L75,50 L35,80" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round"/></svg>',
            chev_down: '<svg viewBox="0 0 100 100"><path d="M20,35 L50,75 L80,35" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round"/></svg>',
            chev_left: '<svg viewBox="0 0 100 100"><path d="M65,20 L25,50 L65,80" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round"/></svg>',

            // Section 2, Row 1 (Pie Charts)
            pie_tl: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="5" x2="50" y2="95" stroke="#1565c0" stroke-width="3"/><line x1="5" y1="50" x2="95" y2="50" stroke="#1565c0" stroke-width="3"/><path d="M50,50 L5,50 A45,45 0 0,1 50,5 Z" fill="#78909c"/></svg>',
            pie_tr: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="5" x2="50" y2="95" stroke="#1565c0" stroke-width="3"/><line x1="5" y1="50" x2="95" y2="50" stroke="#1565c0" stroke-width="3"/><path d="M50,50 L50,5 A45,45 0 0,1 95,50 Z" fill="#78909c"/></svg>',
            pie_br: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="5" x2="50" y2="95" stroke="#1565c0" stroke-width="3"/><line x1="5" y1="50" x2="95" y2="50" stroke="#1565c0" stroke-width="3"/><path d="M50,50 L95,50 A45,45 0 0,1 50,95 Z" fill="#78909c"/></svg>',
            pie_bl: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="5" x2="50" y2="95" stroke="#1565c0" stroke-width="3"/><line x1="5" y1="50" x2="95" y2="50" stroke="#1565c0" stroke-width="3"/><path d="M50,50 L50,95 A45,45 0 0,1 5,50 Z" fill="#78909c"/></svg>',

            // Section 2, Row 2 (Rhombus with dots)
            rhom_l: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="10" x2="50" y2="90" stroke="#1565c0" stroke-width="3"/><line x1="10" y1="50" x2="90" y2="50" stroke="#1565c0" stroke-width="3"/><circle cx="30" cy="50" r="6" fill="#424242"/></svg>',
            rhom_t: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="10" x2="50" y2="90" stroke="#1565c0" stroke-width="3"/><line x1="10" y1="50" x2="90" y2="50" stroke="#1565c0" stroke-width="3"/><circle cx="50" cy="30" r="6" fill="#424242"/></svg>',
            rhom_r: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="10" x2="50" y2="90" stroke="#1565c0" stroke-width="3"/><line x1="10" y1="50" x2="90" y2="50" stroke="#1565c0" stroke-width="3"/><circle cx="70" cy="50" r="6" fill="#424242"/></svg>',
            rhom_b: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="#1565c0" stroke-width="3"/><line x1="50" y1="10" x2="50" y2="90" stroke="#1565c0" stroke-width="3"/><line x1="10" y1="50" x2="90" y2="50" stroke="#1565c0" stroke-width="3"/><circle cx="50" cy="70" r="6" fill="#424242"/></svg>'
        };

        const levels = [
            { // Level 1 (Book Row 6)
                sequence: ['diamond', 'star', 'heart', 'flower', 'diamond', 'star'],
                answer: 'heart',
                options: ['flower', 'diamond', 'heart', 'star']
            },
            { // Level 2 (Book Row 8)
                sequence: ['circle', 'plus', 'vshape', 'arch', 'circle', 'plus'],
                answer: 'vshape',
                options: ['plus', 'arch', 'circle', 'vshape']
            },
            { // Level 3 (Book Section 2, Row 1)
                sequence: ['pie_tl', 'pie_tr', 'pie_br'],
                answer: 'pie_bl',
                options: ['pie_tr', 'pie_bl', 'pie_tl', 'pie_br']
            },
            { // Level 4 (Book Row 5)
                sequence: ['chev_up', 'chev_right', 'chev_down', 'chev_left', 'chev_up', 'chev_right'],
                answer: 'chev_down',
                options: ['chev_right', 'chev_up', 'chev_left', 'chev_down']
            },
            { // Level 5 (Book Section 2, Row 2)
                sequence: ['rhom_l', 'rhom_t', 'rhom_r'],
                answer: 'rhom_b',
                options: ['rhom_t', 'rhom_r', 'rhom_b', 'rhom_l']
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedOptionId = null;

        const patternContainer = document.getElementById('pattern-container');
        const optionsContainer = document.getElementById('options-container');
        const feedbackMsg = document.getElementById('feedback-msg');
        const scoreDisplay = document.getElementById('score-display');
        const gameBoard = document.getElementById('game-board');
        const endScreen = document.getElementById('end-screen');

        function startGame() {
            currentLevel = 0;
            score = 0;
            gameBoard.style.display = 'block';
            endScreen.style.display = 'none';
            updateScore();
            loadLevel();
        }

        function loadLevel() {
            feedbackMsg.textContent = '';
            feedbackMsg.className = 'feedback';
            patternContainer.innerHTML = '';
            optionsContainer.innerHTML = '';
            selectedOptionId = null;

            if (currentLevel >= levels.length) {
                endGame();
                return;
            }

            const level = levels[currentLevel];

            // 1. Load Pattern Sequence
            level.sequence.forEach(itemKey => {
                const div = document.createElement('div');
                div.className = 'pattern-item';
                div.innerHTML = svgs[itemKey];
                patternContainer.appendChild(div);
            });

            // 2. Load Drop Zone
            const dropZone = document.createElement('div');
            dropZone.className = 'drop-zone';
            dropZone.id = 'drop-zone';
            
            // Drag-Drop Events for PC
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('highlight'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('highlight'));
            dropZone.addEventListener('drop', handleDrop);
            
            // Click Events for Mobile
            dropZone.addEventListener('click', () => {
                if(selectedOptionId) checkAnswer(selectedOptionId);
            });
            
            patternContainer.appendChild(dropZone);

            // 3. Load Options
            let shuffledOptions = [...level.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(optKey => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.innerHTML = svgs[optKey];
                optDiv.draggable = true;
                optDiv.setAttribute('data-id', optKey);
                
                // Drag start for PC
                optDiv.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', optKey);
                });
                
                // Click for Mobile
                optDiv.addEventListener('click', () => {
                    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                    optDiv.classList.add('selected');
                    selectedOptionId = optKey;
                });
                
                optionsContainer.appendChild(optDiv);
            });
        }

        function handleDrop(e) {
            e.preventDefault();
            e.target.closest('.drop-zone').classList.remove('highlight');
            const draggedId = e.dataTransfer.getData('text/plain');
            if(draggedId) checkAnswer(draggedId);
        }

        function checkAnswer(answerId) {
            const correctId = levels[currentLevel].answer;
            const dropZone = document.getElementById('drop-zone');

            if (answerId === correctId) {
                // Correct Answer
                dropZone.innerHTML = svgs[answerId];
                dropZone.style.border = '3px solid #388e3c';
                dropZone.style.backgroundColor = '#e8f5e9';
                
                feedbackMsg.textContent = 'ખૂબ સરસ!';
                feedbackMsg.className = 'feedback correct';
                score += 10;
                updateScore();

                optionsContainer.style.pointerEvents = 'none'; // Prevent extra clicks

                setTimeout(() => {
                    currentLevel++;
                    optionsContainer.style.pointerEvents = 'auto';
                    loadLevel();
                }, 1500);
            } else {
                // Wrong Answer
                feedbackMsg.textContent = 'ખોટો જવાબ';
                feedbackMsg.className = 'feedback wrong';
                
                setTimeout(() => { feedbackMsg.textContent = ''; }, 1200);
            }
        }

        function updateScore() {
            scoreDisplay.textContent = `સ્કોર: ${score}`;
        }

        function endGame() {
            gameBoard.style.display = 'none';
            endScreen.style.display = 'block';
            document.getElementById('final-score').textContent = `તમારો કુલ સ્કોર: ${score} / ${levels.length * 10}`;
        }

        // Initialize Game
        startGame();
    </script>
</body>
</html>
